    sections:
      - type: grid
        cards:
          - type: markdown
            title: DHW — Overview
            content: >
              **Heating mode:** {{ states('input_select.dhw_heating_mode') }}

              **Should heat now:** {{
              states('binary_sensor.dhw_should_heat_now') }}

              **Reason:** {{
              state_attr('binary_sensor.dhw_should_heat_now','reason') }}


              **Current price:** {{
              states('sensor.current_electricity_price_in_cents') }} c/kWh

              **Active threshold:** {{
              states('sensor.dhw_active_threshold_ckwh') }} c/kWh

              **Pricing mode:** {{ states('input_select.dhw_pricing_mode') }}
          - type: entities
            title: DHW — Controls & Key Numbers
            show_header_toggle: false
            entities:
              - entity: input_select.dhw_heating_mode
                name: Heating Mode
              - entity: sensor.current_electricity_price_in_cents
                name: Current Price
              - entity: sensor.dhw_active_threshold_ckwh
                name: Active threshold
              - entity: input_select.dhw_pricing_mode
                name: Pricing mode (per day)
              - entity: input_number.dynamic_threshold_factor
                name: Dyn threshold
              - entity: water_heater.cu401b_s_domestic_hot_water
                name: DHW
              - entity: input_number.dhw_target_temp
                name: Target temp
                icon: mdi:water-thermometer
              - entity: input_number.dhw_eco_temp
                icon: mdi:tree
                name: Eco Temp
          - type: entities
            title: DHW — Legionella
            show_header_toggle: false
            entities:
              - entity: input_boolean.dhw_legionella_enabled
                name: Enabled
              - entity: input_datetime.dhw_legionella_last_run
                name: Last run
              - entity: input_number.dhw_legionella_temp
                name: Temperature (°C)
              - entity: input_number.dhw_legionella_hours
                name: Duration (h)
              - entity: sensor.dhw_legionella_cheapest_slot_strict
                name: Strict slot (≤ 1 c/kWh)
              - entity: sensor.dhw_legionella_cheapest_slot_any
                name: Fallback slot (any)
              - entity: input_button.dhw_legionella_run_now
                name: Run now
              - entity: input_button.dhw_legionella_cancel
                name: Cancel Run
          - type: entities
            title: DHW — Boost
            show_header_toggle: false
            entities:
              - entity: sensor.dhw_boost_elapsed_time
                name: Boost (elapsed)
              - entity: input_button.dhw_boost_start
                name: Start
              - entity: input_button.dhw_boost_cancel
                name: Cancel
      - type: grid
        cards:
          - type: entities
            title: DHW — Manual Windows
            show_header_toggle: false
            entities:
              - entity: input_boolean.dhw_manual_today_enable
                name: Manual window today (enabled)
              - entity: input_datetime.dhw_manual_today_start_slot1
                name: Today start (Slot 1)
              - entity: input_datetime.dhw_manual_today_end_slot1
                name: Today end (Slot 1)
              - entity: input_datetime.dhw_manual_today_start_slot2
                name: Today start (Slot 2)
              - entity: input_datetime.dhw_manual_today_end_slot2
                name: Today end (Slot 2)
              - entity: input_datetime.dhw_manual_tomorrow_start_slot1
                name: Tomorrow start (Slot 1)
              - entity: input_datetime.dhw_manual_tomorrow_end_slot1
                name: Tomorrow end (Slot 1)
              - entity: input_datetime.dhw_manual_tomorrow_start_slot2
                name: Tomorrow start (Slot 2)
              - entity: input_datetime.dhw_manual_tomorrow_end_slot2
                name: Tomorrow end (Slot 2)
      - type: grid
        cards:
          - type: custom:apexcharts-card
            header:
              title: DHW — 3-Day Price History & Forecast
              show: true
            graph_span: 72h
            span:
              start: day
              offset: "-1d"
            now:
              show: true
              label: Now
            apex_config:
              grid:
                show: true
              legend:
                show: false
              stroke:
                dashArray: 2
              markers:
                size: 0
              tooltip:
                x:
                  format: dd MMM HH:mm
                y:
                  formatter: |
                    EVAL: (value, { seriesIndex, w }) => {
                      const name = w?.config?.series?.[seriesIndex]?.name || '';
                      const fmtPrice = v => `${(Number(v) ?? 0).toFixed(3)} c/kWh`;

                      if (name === 'Electricity Price') return fmtPrice(value);
                      if (name === 'Heating Decision') {
                        const codes = ['OFF','MULTI','CHEAP','MORN','MANUAL','VICARE'];
                        const code = codes[Math.round(value)] || 'OFF';
                        return `Decision: ${code}`;
                      }
                      if (name === 'Avg Yesterday' || name === 'Avg Today' || name === 'Avg Tomorrow') {
                        return fmtPrice(value);
                      }
                      if (name === 'Active Threshold (Today)') return `Threshold: ${fmtPrice(value)}`;
                      // Fallback: treat numeric as price
                      if (typeof value === 'number') return fmtPrice(value);
                      return String(value ?? '');
                    }

            update_interval: 1min
            experimental:
              color_threshold: true
            yaxis:
              - id: price
                min: ~0
                decimals: 2
                show: false
                apex_config:
                  forceNiceScale: true
              - id: decision
                min: 0
                max: 5
                decimals: 0
                opposite: true
                show: true
                apex_config:
                  labels:
                    formatter: >
                      EVAL:v => {const codes = ['OFF', 'MULTI', 'CHEAP', 'MORN',
                      'MANUAL', 'VICARE']; return codes[Math.round(v)] || 'OFF'}
            series:
              - entity: sensor.nordpool_3_day_merged_prices
                yaxis_id: price
                name: Electricity Price
                type: column
                unit: c
                opacity: 1
                color_threshold:
                  - value: -1
                    color: "#6EFDEF"
                  - value: 0
                    color: "#6EFD99"
                  - value: 5
                    color: "#FDE86E"
                  - value: 10
                    color: "#FD6E6E"
                  - value: 20
                    color: "#BF40BF"
                data_generator: |
                  const slots = entity.attributes.merged_slots || [];
                  return slots.map(slot => [new Date(slot.start).getTime(), slot.price]);
              - entity: sensor.dhw_heating_decision_code
                yaxis_id: decision
                name: Heating Decision
                type: line
                stroke_width: 2
                color_threshold:
                  - value: -1
                    color: "#808080"
                  - value: 0.5
                    color: "#808080"
                  - value: 1.5
                    color: "#A020F0"
                  - value: 2.5
                    color: "#00FF00"
                  - value: 3.5
                    color: "#FFFF00"
                  - value: 4.5
                    color: "#FFA500"
                  - value: 5
                    color: "#FF0000"
              - entity: sensor.nordpool_average_yesterday
                yaxis_id: price
                name: Avg Yesterday
                type: line
                stroke_width: 2
                color: "#8888ff"
                show:
                  legend_value: false
                data_generator: |
                  // Render a horizontal line only over yesterday (local time)
                  const avg = parseFloat(entity.state);
                  if (isNaN(avg)) return [];

                  const now = new Date();
                  // local yesterday 00:00:00.000
                  const y0 = new Date(now);
                  y0.setDate(now.getDate() - 1);
                  y0.setHours(0,0,0,0);

                  // local yesterday 23:59:59.999
                  const y1 = new Date(y0);
                  y1.setHours(23,59,59,999);


                  // Add a null right after y1 to break the line
                  const gap = new Date(y1.getTime() + 1);

                  return [
                    [y0.getTime(), avg],
                    [y1.getTime(), avg],
                    [gap.getTime(), null],   // forces the renderer to stop the line
                  ];
              - entity: sensor.nordpool_average_today
                yaxis_id: price
                name: Avg Today
                type: line
                stroke_width: 2
                color: "#44aa88"
                show:
                  legend_value: false
                data_generator: |
                  const avg = parseFloat(entity.state);
                  if (isNaN(avg)) return [];

                  // local today 00:00:00.000
                  const t0 = new Date();
                  t0.setHours(0,0,0,0);

                  // local today 23:59:59.999
                  const t1 = new Date(t0);
                  t1.setHours(23,59,59,999);

                  // Add a null right after t1 to break the line
                  const gap = new Date(t1.getTime() + 1);

                  return [
                    [t0.getTime(), avg],
                    [t1.getTime(), avg],
                    [gap.getTime(), null],
                  ];
              - entity: sensor.nordpool_average_tomorrow
                yaxis_id: price
                name: Avg Tomorrow
                type: line
                stroke_width: 2
                color: "#cc8800"
                show:
                  legend_value: false
                data_generator: >
                  // Render a horizontal line only over tomorrow (local time)
                  when avg is known

                  const raw = entity.state;

                  const avg = parseFloat(raw);

                  if (isNaN(avg)) return [];  // avoids drawing when 'unknown'
                  or not yet published


                  const now = new Date();


                  // local tomorrow 00:00:00.000

                  const d0 = new Date(now);

                  d0.setDate(now.getDate() + 1);

                  d0.setHours(0,0,0,0);


                  // local tomorrow 23:59:59.999

                  const d1 = new Date(d0);

                  d1.setHours(23,59,59,999);


                  // break the line after day end

                  const gap = new Date(d1.getTime() + 1);


                  return [
                    [d0.getTime(), avg],
                    [d1.getTime(), avg],
                    [gap.getTime(), null],
                  ];
              
              # --- Active threshold (today only) ---
              - entity: sensor.dhw_active_threshold_ckwh
                yaxis_id: price
                name: Active Threshold (Today)
                type: line
                stroke_width: 2
                color: "#9a9a9a"
                show:
                  legend_value: false
                data_generator: |
                  const thr = parseFloat(entity.state);
                  if (isNaN(thr)) return [];
              
                  const t0 = new Date();
                  t0.setHours(0,0,0,0);
                  const t1 = new Date(t0);
                  t1.setHours(23,59,59,999);
                  const gap = new Date(t1.getTime() + 1);
              
                  return [
                    [t0.getTime(), thr],
                    [t1.getTime(), thr],
                    [gap.getTime(), null],   // stop after today
                  ];
          - type: markdown
            title: DHW — Decision Breakdown (live)
            content: >
              **Morning window reasonable:** {{
              states('binary_sensor.dhw_morning_reasonable') }}

              **Morning details:**

              {% set price_now =
              states('sensor.current_electricity_price_in_cents') | float(999)
              %}

              {% set thr       = states('sensor.dhw_active_threshold_ckwh') |
              float(0) %}

              {% set start     =
              today_at(states('input_datetime.dhw_morning_start')) %}

              {% set end       =
              today_at(states('input_datetime.dhw_morning_end')) %}

              {% set within    = (now() >= start and now() < end) %}

              - Window: {{ states('input_datetime.dhw_morning_start') }} → {{
              states('input_datetime.dhw_morning_end') }}

              - Within window now: {{ within }}

              - Price now: {{ price_now }} c/kWh

              - Threshold: {{ thr }} c/kWh


              **Manual today active:** {{
              states('binary_sensor.dhw_manual_today_active') }}

              - Slot 1: {{ states('input_datetime.dhw_manual_today_start_slot1')
              }} → {{ states('input_datetime.dhw_manual_today_end_slot1') }}

              - Slot 2: {{ states('input_datetime.dhw_manual_today_start_slot2')
              }} → {{ states('input_datetime.dhw_manual_today_end_slot2') }}


              **Cheapest window active now:** {{
              states('binary_sensor.dhw_cheapest_window_active_now') }}

              **Cheapest window summary:** {{
              states('sensor.dhw_cheapest_window_label') }}

              - Start: {{
              state_attr('sensor.dhw_cheapest_window_detail','start') }}

              - End:   {{ state_attr('sensor.dhw_cheapest_window_detail','end')
              }}

              - Avg price: {{
              state_attr('sensor.dhw_cheapest_window_detail','avg_price') }}
          - type: markdown
            title: DHW — Upcoming Slots
            content: >
              {% set cw_s =
              state_attr('sensor.dhw_cheapest_window_detail','start') %}

              {% set cw_e =
              state_attr('sensor.dhw_cheapest_window_detail','end') %}

              {% set cw_avg =
              state_attr('sensor.dhw_cheapest_window_detail','avg_price') %}

              {% set strict_ready =
              is_state('sensor.dhw_legionella_cheapest_slot_strict','ready') %}

              {% set any_ready =
              is_state('sensor.dhw_legionella_cheapest_slot_any','ready') %}


              **Cheapest window (next):**

              - {{ cw_s }} → {{ cw_e }} (avg {{ cw_avg }})


              **Legionella (next):**

              {% if strict_ready %}

              - STRICT: {{
              state_attr('sensor.dhw_legionella_cheapest_slot_strict','start')
              }} → {{
              state_attr('sensor.dhw_legionella_cheapest_slot_strict','end') }}
                (avg {{ state_attr('sensor.dhw_legionella_cheapest_slot_strict','avg_price') }} c/kWh)
              {% elif any_ready %}

              - ANY (fallback): {{
              state_attr('sensor.dhw_legionella_cheapest_slot_any','start') }} →
              {{ state_attr('sensor.dhw_legionella_cheapest_slot_any','end') }}
                (avg {{ state_attr('sensor.dhw_legionella_cheapest_slot_any','avg_price') }} c/kWh)
              {% else %}

              - No slot data yet

              {% endif %}
