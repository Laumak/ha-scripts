views:
  - sections:
      - type: grid
        cards:
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            title: null
            sun_entity: sun.sun
            temperature_sensor: sensor.ulkona_temperature
            humidity_sensor: sensor.ulkona_humidity
            weather_icon_type: line
            animated_icon: true
            forecast_rows: 5
            time_pattern: HH:mm
            time_format: 24
            date_pattern: ccc, d.MM.yy
            hide_today_section: false
            hide_forecast_section: false
            show_humidity: true
            hide_clock: false
            hide_date: true
            hourly_forecast: false
            use_browser_time: false
            time_zone: null
            show_decimal: false
            apparent_sensor: sensor.real_feel_temperature
            aqi_sensor: sensor.air_quality_index
          - show_name: true
            show_icon: true
            show_state: true
            type: glance
            entities:
              - entity: sensor.ulkona_temperature
                name: Ulkona
              - entity: sensor.keskilampotila_sisalla
                name: Sisällä
              - entity: sensor.current_electricity_price_in_cents
                name: Hinta nyt
              - entity: sensor.nordpool_average_today
                name: Tänään KA
            columns: 4
          - type: custom:custom-features-card
            features:
              - type: custom:service-call
                entries:
                  - type: toggle
                    entity_id: input_boolean.kotona
                    icon: ''
                    tap_action:
                      action: more-info
                      target:
                        entity_id: input_boolean.kotona
                    unchecked_icon: mdi:home-off
                    checked_icon: mdi:home-account
                    autofill_entity_id: false
                    haptics: true
                    label: >-
                      {{ 'Kotona' if is_state('input_boolean.kotona', 'on') else
                      'Ei kotona' }} 
                    value_from_hass_delay: 1
            transparent: false
            grid_options:
              columns: 6
              rows: auto
            feature_height: 30
          - type: tile
            entity: climate.cu401b_s_heating
            name: MLP Mode
            color: accent
            hide_state: false
            state_content: active_vicare_mode
            vertical: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-uuz/vesi
            features_position: bottom
          - type: tile
            entity: sensor.p1_meter_power
            name: Sähkönkulutus nyt
            vertical: false
            icon_tap_action:
              action: navigate
              navigation_path: /dashboard-uuz/sähkö
            features:
              - type: trend-graph
                hours_to_show: 1
                detail: false
            features_position: inline
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: sensor.cu401b_s_dhw_storage_temperature
            name: Vesi
            icon: mdi:thermometer-water
            vertical: false
            features:
              - type: trend-graph
                hours_to_show: 1
                detail: false
            features_position: inline
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: binary_sensor.dhw_should_heat_now
            name: Should DHW Heat Now?
            icon: mdi:thermometer-water
            color: red
            state_content: reason
            vertical: false
            tap_action:
              action: navigate
              navigation_path: /dashboard-uuz/3
            features_position: bottom
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_datetime.heating_on
                name: Start
              - entity: input_datetime.heating_off
                name: End
            state_color: false
      - type: grid
        cards:
          - type: custom:expander-card
            title: Nellin huone
            cards:
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: tile
                        entity: climate.nellin_huoneen_termostaatti
                        name: Termostaatti
                        hide_state: false
                        state_content:
                          - preset_mode
                          - temperature
                        vertical: true
                        features_position: bottom
                      - type: tile
                        grid_options:
                          columns: 6
                          rows: 2
                        entity: sensor.nelli_shelly_power
                        name: Lämpöpatteri
                        icon: mdi:radiator
                        color: accent
                        vertical: false
                        features:
                          - type: custom:service-call
                            entries:
                              - type: toggle
                                entity_id: switch.nelli_shelly
                                tap_action:
                                  action: toggle
                                  target:
                                    entity_id: switch.nelli_shelly
                                  data: {}
                                autofill_entity_id: false
                                haptics: true
                                unchecked_icon: mdi:radiator-off
                                checked_icon: mdi:radiator
                                icon: ''
                                thumb: default
                          - type: trend-graph
                            detail: true
                            hours_to_show: 1
                        features_position: bottom
                  - type: vertical-stack
                    cards:
                      - graph: line
                        type: sensor
                        entity: sensor.ruuvitag_be6d_temperature
                        detail: 2
                        hours_to_show: 1
                        name: Lämpötila
                      - graph: line
                        type: sensor
                        entity: sensor.ruuvitag_be6d_humidity
                        detail: 1
                        hours_to_show: 3
                        name: Kosteus
              - type: tile
                grid_options:
                  columns: 6
                  rows: 2
                entity: light.nellin_huoneen_valot
                name: Valot
                show_entity_picture: false
                hide_state: true
                vertical: false
                features:
                  - type: light-brightness
                features_position: bottom
            animation: true
            title-card:
              features:
                - type: area-controls
                - type: custom:service-call
                  entries: []
              camera_view: auto
              alert_classes:
                - motion
                - moisture
              sensor_classes:
                - temperature
                - humidity
                - power
              display_type: camera
              type: area
              area: nellin_huone
              features_position: bottom
              color: hotpink
              vertical: false
            title-card-clickable: false
            title-card-button-overlay: true
            overlay-margin: 20px
            child-margin-top: 10px
          - type: custom:expander-card
            title: Olivian huone
            cards:
              - type: horizontal-stack
                cards:
                  - type: vertical-stack
                    cards:
                      - type: tile
                        entity: climate.olivian_huoneen_termostaatti
                        name: Termostaatti
                        show_entity_picture: false
                        hide_state: false
                        state_content:
                          - preset_mode
                          - temperature
                        vertical: true
                        features_position: bottom
                      - type: tile
                        grid_options:
                          columns: 6
                          rows: 2
                        entity: sensor.olivia_shelly_power
                        name: Sähköpatteri
                        icon: mdi:radiator
                        color: accent
                        vertical: false
                        features:
                          - type: custom:service-call
                            entries:
                              - type: toggle
                                entity_id: switch.olivia_shelly
                                tap_action:
                                  action: toggle
                                  target:
                                    entity_id: switch.olivia_shelly
                                  data: {}
                                autofill_entity_id: false
                                haptics: true
                                checked_icon: mdi:radiator
                                unchecked_icon: mdi:radiator-off
                          - type: trend-graph
                            detail: true
                            hours_to_show: 1
                        features_position: bottom
                  - type: vertical-stack
                    cards:
                      - graph: line
                        type: sensor
                        entity: sensor.ruuvitag_1f2f_temperature
                        detail: 2
                        name: Lämpötila
                        hours_to_show: 1
                      - graph: line
                        type: sensor
                        entity: sensor.ruuvitag_1f2f_humidity
                        detail: 1
                        name: Kosteus
                        hours_to_show: 3
              - type: tile
                grid_options:
                  columns: 6
                  rows: 2
                entity: light.valo_1
                name: Valot
                hide_state: true
                vertical: false
                features:
                  - type: light-brightness
                features_position: bottom
            title-card:
              features:
                - type: area-controls
              camera_view: auto
              alert_classes:
                - motion
                - moisture
              sensor_classes:
                - temperature
                - humidity
                - power
              display_type: camera
              type: area
              area: olivian_huone
              features_position: bottom
              color: purple
              vertical: false
            title-card-clickable: false
            title-card-button-overlay: true
            clear: false
            overlay-margin: 20px
            child-margin-top: 10px
      - type: grid
        cards:
          - type: custom:expander-card
            title: Makkari
            cards:
