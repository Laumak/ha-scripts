                                      select.makkareiden_ilmankostutin_spraying_level
                              - entity_id: >-
                                  select.makkareiden_ilmankostutin_spraying_level
                                option: LEVEL 3
                                tap_action:
                                  action: perform-action
                                  perform_action: select.select_option
                                  data:
                                    option: LEVEL 3
                                  target:
                                    entity_id: >-
                                      select.makkareiden_ilmankostutin_spraying_level
                              - entity_id: >-
