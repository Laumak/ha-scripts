              if(state_attr('sensor.dhw_cheapest_window_detail','tomorrow_start'))
              != 'unknown' %}


              - **Start:** `{{
              state_attr('sensor.dhw_cheapest_window_detail','tomorrow_start')
              }}`

              - **End:** `{{
              state_attr('sensor.dhw_cheapest_window_detail','tomorrow_end') }}`

              - **Average price:** `{{
              state_attr('sensor.dhw_cheapest_window_detail','tomorrow_avg_price')
              }} c/kWh` 


              {% else %}


              No tomorrow prices available yet.


              {% endif %}
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_select.dhw_heating_mode
                name: Heating Mode
              - entity: input_select.dhw_pricing_mode
                name: Pricing mode (per day)
              - entity: sensor.current_electricity_price_in_cents
                name: Current Price
              - entity: sensor.nordpool_average_today
                icon: mdi:format-align-middle
                name: Avg Today
              - entity: sensor.nordpool_average_tomorrow
                name: Avg Tomorrow
              - entity: sensor.dhw_active_threshold_ckwh
                name: Active threshold
                secondary_info: none
              - entity: input_number.dynamic_threshold_factor
                name: Dyn threshold
                secondary_info: last-changed
              - entity: input_number.korkein_sallittu_sahkon_hinta
                name: Price Cap
                secondary_info: last-updated
              - entity: water_heater.cu401b_s_domestic_hot_water
                name: DHW
              - entity: input_number.dhw_target_temp
                name: Target temp
                icon: mdi:water-thermometer
                secondary_info: last-changed
              - entity: input_number.dhw_eco_temp
                icon: mdi:tree
                name: Eco Temp
                secondary_info: last-changed
              - entity: input_number.dhw_cheapest_window_hours
                name: Cheapest Win Length
                secondary_info: last-changed
                icon: mdi:clock-edit-outline
              - entity: input_number.dhw_cheapest_soft_cap
                name: Soft Cap
                secondary_info: last-changed
                icon: mdi:currency-eur
      - type: grid
        cards:
          - type: entities
            show_header_toggle: true
            entities:
              - entity: binary_sensor.dhw_manual_today_active
                secondary_info: last-updated
              - entity: input_datetime.dhw_manual_today_start_slot1
                name: Slot 1 Start
              - entity: input_datetime.dhw_manual_today_end_slot1
                name: Slot 1 End
              - entity: input_datetime.dhw_manual_today_start_slot2
                name: Slot 2 Start
              - entity: input_datetime.dhw_manual_today_end_slot2
                name: Slot 2 End
            state_color: true
            title: Manual Water Heating Today
      - type: grid
        cards:
          - type: custom:expander-card
            title: Tomorrow manual heating
            cards:
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: input_datetime.dhw_manual_tomorrow_start_slot1
                    name: Start 1
                  - entity: input_datetime.dhw_manual_tomorrow_end_slot1
                    name: End 1
                  - entity: input_datetime.dhw_manual_tomorrow_start_slot2
                    name: Start 2
                  - entity: input_datetime.dhw_manual_tomorrow_end_slot2
                    name: End 2
          - type: custom:expander-card
            title: 🔥 DHW — Heating Decisions
            cards:
              - type: markdown
                content: >
                  ### **Heating on?**  

                  → `{{ states('binary_sensor.dhw_should_heat_now') }}` (`{{
                  state_attr('binary_sensor.dhw_should_heat_now','reason') }}`)


                  ---


                  ## **Price Conditions**

                  - **Current price:** `{{
                  states('sensor.current_electricity_price_in_cents') }} c/kWh`

                  - **Dynamic threshold:** `{{
                  states('sensor.dhw_active_threshold_ckwh') }} c/kWh`

                  - **Soft cap (cheapest-window max):** `{{
                  states('input_number.dhw_cheapest_soft_cap') }} c/kWh`


                  **Passes threshold?**  

                  → `{{ (states('sensor.current_electricity_price_in_cents') |
                  float(999)) 
                        <= (states('sensor.dhw_active_threshold_ckwh') | float(0)) }}`

                  **Passes soft cap?**  

                  → `{{ (states('sensor.current_electricity_price_in_cents') |
                  float(999)) 
                        <= (states('input_number.dhw_cheapest_soft_cap') | float(20)) }}`

                  ---


                  ## Cheapest Window Today

                  - **Start:** `{{
                  state_attr('sensor.dhw_cheapest_window_detail','today_absolute_start')
                  }}`

                  - **End:** `{{
                  state_attr('sensor.dhw_cheapest_window_detail','today_absolute_end')
                  }}`

                  - **Average price:** `{{
                  state_attr('sensor.dhw_cheapest_window_detail','today_absolute_avg_price')
                  }} c/kWh`


                  **Cheapest (absolute) active now?**  

                  → `{{ states('binary_sensor.dhw_cheapest_window_active_now')
                  }}`


                  ---


                  ## Cheapest Window Tomorrow

                  {%
                  if(state_attr('sensor.dhw_cheapest_window_detail','tomorrow_start'))
                  != 'unknown' %}


                  - **Start:** `{{
                  state_attr('sensor.dhw_cheapest_window_detail','tomorrow_start')
                  }}`

                  - **End:** `{{
                  state_attr('sensor.dhw_cheapest_window_detail','tomorrow_end')
                  }}`

                  - **Average price:** `{{
                  state_attr('sensor.dhw_cheapest_window_detail','tomorrow_avg_price')
                  }} c/kWh` 


                  {% else %}


                  No tomorrow prices available yet.


                  {% endif %}


                  ---


                  ## **Next Heating Window (Scheduled)**

                  {# Prefer today's actionable window (ends > now). Otherwise
                  show tomorrow. #}

                  {% set s_act =
                  state_attr('sensor.dhw_cheapest_window_detail','start') %}

                  {% set e_act =
                  state_attr('sensor.dhw_cheapest_window_detail','end') %}

                  {% set avg_act =
                  state_attr('sensor.dhw_cheapest_window_detail','avg_price') %}

                  {% set s_tom =
                  state_attr('sensor.dhw_cheapest_window_detail','tomorrow_start')
                  %}

                  {% set e_tom =
                  state_attr('sensor.dhw_cheapest_window_detail','tomorrow_end')
                  %}

                  {% set avg_tom =
                  state_attr('sensor.dhw_cheapest_window_detail','tomorrow_avg_price')
                  %}


                  {% set has_act = (s_act not in
                  ['unknown','unavailable',None,''] and e_act not in
                  ['unknown','unavailable',None,'']) %}

                  {% set has_tom = (s_tom not in
                  ['unknown','unavailable',None,''] and e_tom not in
                  ['unknown','unavailable',None,'']) %}


                  {% if has_act %}
                    {% set start_dt = as_local(as_datetime(s_act)) %}
                    {% set end_dt   = as_local(as_datetime(e_act)) %}
                  {% endif %}

                  {% if not has_act or (has_act and end_dt <= now()) %}
                    {% set start_dt = as_local(as_datetime(s_tom)) if has_tom else None %}
                    {% set end_dt   = as_local(as_datetime(e_tom)) if has_tom else None %}
                  {% endif %}


                  {% if start_dt and end_dt %}

                  - **Start:** `{{ start_dt }}`

                  - **End:** `{{ end_dt }}`

                  - **Avg price:** `{{ avg_act if has_act and end_dt > now()
                  else avg_tom }} c/kWh`


                  {% set mins = ((start_dt - now()).total_seconds() / 60) | int
                  %}


                  {% if mins >= 0 %}
                      {% set hours = mins // 60 %}
                      {% set minutes = mins % 60 %}
                  - **Begins in:** {{ "%d hours %d minutes" | format(hours,
                  minutes) }}

                  {% else %}
                      {% set ago = (0 - mins) %}
                      {% set hours = ago // 60 %}
                      {% set minutes = ago % 60 %}
                  - **Started:** {{ "%d hours %d minutes" | format(hours,
                  minutes) }} ago

                  {% endif %}


                  {% else %}

                  - **No upcoming window today; and tomorrow not available
                  yet.**

                  {% endif %}


                  ---


                  ## **Other Conditions**

                  - **Morning window OK:** `{{
                  states('binary_sensor.dhw_morning_reasonable') }}`

                  - **Manual window active:** `{{
                  states('binary_sensor.dhw_manual_today_active') }}`

                  - **Boost active:** `{{
                  states('binary_sensor.maalampo_one_time_charge') }}`

                  - **Heating mode:** `{{
                  states('input_select.dhw_heating_mode') }}`
          - type: custom:expander-card
            cards:
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: sensor.dhw_boost_elapsed_time
                    name: Boost (elapsed)
                  - entity: input_button.dhw_boost_start
                    name: Start
                  - entity: input_button.dhw_boost_cancel
                    name: Cancel
                  - entity: binary_sensor.maalampo_one_time_charge
                    name: DHW OTC
            title: DHW Boost
          - type: custom:expander-card
            title: DHW Legionella prevention
            cards:
              - type: entities
                show_header_toggle: false
                entities:
                  - entity: input_boolean.dhw_legionella_enabled
                    name: Enabled
                  - entity: input_datetime.dhw_legionella_last_run
                    name: Last run
                    secondary_info: none
                  - entity: sensor.dhw_legionella_next_start
                    name: Next start
                    secondary_info: datetime
                  - entity: sensor.dhw_legionella_next_end
                    name: Next end
                    secondary_info: datetime
                  - entity: sensor.dhw_legionella_next_run_avg_price
                    name: Next Avg Price
                    icon: mdi:currency-eur
                  - entity: input_number.dhw_legionella_temp
                    name: Target Temp
                    secondary_info: state
                  - entity: input_number.dhw_legionella_hours
                    name: Duration (h)
                  - entity: binary_sensor.dhw_legionella_cheapest_slot_strict
                    name: Strict slot (≤ 1 c/kWh)
                  - entity: binary_sensor.dhw_legionella_cheapest_slot_any
                    name: Fallback slot (any)
                  - entity: input_button.dhw_legionella_run_now
                    name: Run now
                  - entity: input_button.dhw_legionella_cancel
                    name: Cancel Run
            expanded: false
      - type: grid
        cards:
          - type: tile
            grid_options:
              columns: 12
              rows: 1
            entity: input_select.dhw_chart_preset
            name: Preset
            hide_state: true
            vertical: false
            features:
              - type: select-options
            features_position: inline
          - type: custom:apexcharts-card
            header:
              title: DHW — 3-Day Price History & Forecast
              show: false
            update_interval: 1min
            show:
              last_updated: true
            apex_config:
              chart:
                id: >
                  [[[ return 'dhw-' +
                  states['input_select.dhw_chart_preset'].state; ]]]
                animations:
                  enabled: false
                toolbar:
                  show: false
                start: |
                  [[[
                    const p = states['input_select.dhw_chart_preset'].state;
                    const now = new Date();

                    // Today 00:00
                    const t0 = new Date(now);
                    t0.setHours(0,0,0,0);

                    if (p === '3 Days') {
                      const y = new Date(t0);
                      y.setDate(y.getDate() - 1);
                      return y.getTime();
                    }

                    // Today + Tomorrow OR Today
                    return t0.getTime();
                  ]]]
                end: |
                  [[[
                    const p = states['input_select.dhw_chart_preset'].state;
                    const now = new Date();

                    // Today 00:00
                    const t0 = new Date(now);
                    t0.setHours(0,0,0,0);

                    if (p === '3 Days') {
                      const t = new Date(t0);
                      t.setDate(t.getDate() + 2);
                      t.setHours(23,59,59,999);
                      return t.getTime();
                    }

                    if (p === 'Today + Tomorrow') {
                      const t = new Date(t0);
                      t.setDate(t.getDate() + 1);
                      t.setHours(23,59,59,999);
                      return t.getTime();
                    }

                    // Today
                    const t = new Date(t0);
                    t.setHours(23,59,59,999);
                    return t.getTime();
                  ]]]
              grid:
                show: true
              legend:
                show: false
              stroke:
                dashArray: 2
                curve: straight
              markers:
                size: 0
              tooltip:
                x:
                  format: dd MMM HH:mm
                'y':
                  formatter: |
                    EVAL: (value, { seriesIndex, w }) => {
                      const name = w?.config?.series?.[seriesIndex]?.name || '';
                      const fmtPrice = v => `${(Number(v) ?? 0).toFixed(2)} c/kWh`;

                      if (name === 'Electricity Price') return fmtPrice(value);
                      if (name === 'Heating Decision') {
                        const codes = ['OFF','MULTI','CHEAP','MORN','MANUAL','VICARE'];
                        const code = codes[Math.round(value)] || 'OFF';
                        return `Decision: ${code}`;
                      }
                      if (name === 'Avg Yesterday' || name === 'Avg Today' || name === 'Avg Tomorrow') {
                        return fmtPrice(value);
                      }
                      if (name === 'Active Threshold (Today)') return `Threshold: ${fmtPrice(value)}`;
                      if (typeof value === 'number') return fmtPrice(value);
                      return String(value ?? '');
                    }
            experimental:
              color_threshold: true
            yaxis:
              - id: price
                min: ~0
                decimals: 2
                show: false
                apex_config:
                  forceNiceScale: false
              - id: decision
                min: 0
                max: 5
                decimals: 0
                opposite: true
                show: true
                apex_config:
                  labels:
                    formatter: |
                      EVAL:v => {
                        const codes = ['OFF','MULTI','CHEAP','MORN','MANUAL','VICARE'];
                        return codes[Math.round(v)] || 'OFF';
                      }
            series:
              - entity: sensor.nordpool_3_day_merged_prices
                yaxis_id: price
                name: Electricity Price
                type: column
                unit: c
                opacity: 1
                color_threshold:
                  - value: -1
                    color: '#6EFDEF'
                  - value: 0
                    color: '#6EFD99'
                  - value: 5
                    color: '#FDE86E'
                  - value: 10
                    color: '#FD6E6E'
                  - value: 20
                    color: '#BF40BF'
                data_generator: |
                  try {
                    const slots = entity.attributes.merged_slots || [];
                    return slots.map(slot => [new Date(slot.start).getTime(), slot.price]);
                  } catch (e) {
                    return [];
                  }
              - entity: sensor.dhw_heating_decision_code
                yaxis_id: decision
                name: Heating Decision
                type: line
                stroke_width: 2
                color: limegreen
              - entity: sensor.nordpool_average_yesterday
                yaxis_id: price
                name: Avg Yesterday
                type: line
                stroke_width: 2
                color: '#8888ff'
                show:
                  legend_value: false
                data_generator: >
                  const avg = parseFloat(entity.state); if (isNaN(avg)) return
                  []; const now = new Date(); const y0 = new Date(now);
                  y0.setDate(now.getDate() - 1); y0.setHours(0,0,0,0); const y1
                  = new Date(y0); y1.setHours(23,59,59,999); const gap = new
                  Date(y1.getTime() + 1); return [[y0.getTime(),
                  avg],[y1.getTime(), avg],[gap.getTime(), null]];
              - entity: sensor.nordpool_average_today
                yaxis_id: price
                name: Avg Today
                type: line
                stroke_width: 2
                color: '#44aa88'
                show:
                  legend_value: false
                data_generator: >
                  const avg = parseFloat(entity.state);

                  if (isNaN(avg)) return [];

                  const t0 = new Date(); t0.setHours(0,0,0,0);

                  const t1 = new Date(t0); t1.setHours(23,59,59,999);

                  const gap = new Date(t1.getTime() + 1);

                  return [[t0.getTime(), avg],[t1.getTime(),
                  avg],[gap.getTime(), null]];
              - entity: sensor.nordpool_average_tomorrow
                yaxis_id: price
                name: Avg Tomorrow
                type: line
                stroke_width: 2
                color: '#cc8800'
                show:
                  legend_value: false
                data_generator: >
                  const avg = parseFloat(entity.state); if (isNaN(avg)) return
                  []; const now = new Date(); const d0 = new Date(now);
                  d0.setDate(now.getDate() + 1); d0.setHours(0,0,0,0); const d1
                  = new Date(d0); d1.setHours(23,59,59,999); const gap = new
                  Date(d1.getTime() + 1); return [[d0.getTime(),
                  avg],[d1.getTime(), avg],[gap.getTime(), null]];
              - entity: sensor.dhw_active_threshold_ckwh
                yaxis_id: price
                name: Active Threshold (Today)
                type: line
                stroke_width: 2
                color: '#9a9a9a'
                show:
                  legend_value: false
                data_generator: >
                  const thr = parseFloat(entity.state);

                  if (isNaN(thr)) return [];

                  const t0 = new Date(); t0.setHours(0,0,0,0);

                  const t1 = new Date(t0); t1.setHours(23,59,59,999);

                  const gap = new Date(t1.getTime() + 1);

                  return [[t0.getTime(), thr],[t1.getTime(),
                  thr],[gap.getTime(), null]];
              - entity: sensor.apexcharts_time
                name: Rerender Trigger
                yaxis_id: price
                show:
                  in_chart: false
                data_generator: >
                  const p = states['input_select.dhw_chart_preset'].state; const
                  code = p === '3 Days' ? 1 : p === 'Today + Tomorrow' ? 2 : 3;
                  return [[Date.now(), code]];
