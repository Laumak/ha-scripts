                    {% set prices = window | map(attribute='price') | map('float') | list %}
                    {% if prices|length == k %}
                      {% set sumv = prices | sum %}
                      {% set avg = sumv / k %}
                      {% if avg <= 1.0 and sumv < ns.best_sum %}
                        {% set ns.best_sum = sumv %}
                        {% set ns.best_i = i %}
                      {% endif %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ (ns.best_sum / k) | round(3) if ns.best_i >= 0 else 'none' }}
              {% endif %}

