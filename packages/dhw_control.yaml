# packages/dhw_control.yaml
dhw_control:
  ###########################################################################
  # Phase 1 — Helpers + price threshold sensor (all-English)
  ###########################################################################

  input_select:
    dhw_pricing_mode:
      name: Pricing mode (per day)
      options:
        - Dynamic + cap
        - Dynamic only
        - Manual cap
      initial: Dynamic + cap
      icon: mdi:currency-eur

    dhw_heating_mode:
      name: DHW Heating Mode
      options:
        - Automatic + Manual
        - Manual only
        - "Off"
      initial: Automatic + Manual
      icon: mdi:robot

  input_number:
    price_cap_cents:
      name: Price cap (c/kWh)
      min: 1
      max: 100
      step: 0.5
      unit_of_measurement: "c/kWh"
      initial: 15

    dhw_boost_minutes:
      name: Boost duration (min)
      min: 5
      max: 240
      step: 5
      unit_of_measurement: "min"
      initial: 60

    dhw_cheapest_window_hours:
      name: DHW Cheapest Window Length (h)
      min: 0.25
      max: 6
      step: 0.25 # 0.25 h = 15 minutes
      mode: slider
      unit_of_measurement: "h"
      initial: 2

    # Phase 3 — Actuator temperature helpers
    dhw_target_temp:
      name: DHW Target Temperature (NORMAL)
      min: 45
      max: 60
      step: 1
      unit_of_measurement: "°C"
      initial: 55

    dhw_eco_temp:
      name: DHW ECO Temperature
      min: 20
      max: 50
      step: 1
      unit_of_measurement: "°C"
      initial: 30

    dynamic_threshold_factor:
      name: Dynamic threshold factor (x daily average)
      min: 0.60
      max: 1.00
      step: 0.05
      initial: 0.85

    dhw_legionella_temp:
      name: Legionella Cycle Temperature
      min: 55
      max: 60
      step: 5
      unit_of_measurement: "°C"
      initial: 60

    dhw_legionella_hours:
      name: Legionella Cycle Duration (h)
      min: 1
      max: 6
      step: 0.5
      unit_of_measurement: "h"
      initial: 3

    dhw_cheapest_soft_cap:
      name: Cheapest window soft cap (c/kWh)
      min: 0
      max: 30
      step: 0.5
      unit_of_measurement: "c/kWh"
      initial: 20

  ###########################################################################
  # Phase 2 — Decision sensors + helpers (all-English)
  ###########################################################################

  input_boolean:
    dhw_morning_enable:
      name: Morning window enabled (05-07)
      icon: mdi:weather-sunset-up
      initial: true

    dhw_manual_today_enable:
      name: Manual window today
      icon: mdi:calendar-clock
      initial: false

    dhw_legionella_enabled:
      name: Legionella Cycle Enabled
      initial: true
      icon: mdi:shield-check

  input_datetime:
    # Today slots
    dhw_manual_today_start_slot1:
      name: Manual today start (Slot 1)
      has_date: false
      has_time: true

    dhw_manual_today_end_slot1:
      name: Manual today end (Slot 1)
      has_date: false
      has_time: true

    dhw_manual_today_start_slot2:
      name: Manual today start (Slot 2)
      has_date: false
      has_time: true

    dhw_manual_today_end_slot2:
      name: Manual today end (Slot 2)
      has_date: false
      has_time: true

    # Tomorrow slots
    dhw_manual_tomorrow_start_slot1:
      name: Manual tomorrow start (Slot 1)
      has_date: false
      has_time: true

    dhw_manual_tomorrow_end_slot1:
      name: Manual tomorrow end (Slot 1)
      has_date: false
      has_time: true

    dhw_manual_tomorrow_start_slot2:
      name: Manual tomorrow start (Slot 2)
      has_date: false
      has_time: true

    dhw_manual_tomorrow_end_slot2:
      name: Manual tomorrow end (Slot 2)
      has_date: false
      has_time: true

    # Configurable DHW morning times
    dhw_morning_start:
      name: Morning start
      has_date: false
      has_time: true
      initial: "05:00:00"

    dhw_morning_end:
      name: Morning end
      has_date: false
      has_time: true
      initial: "07:00:00"

    dhw_legionella_last_run:
      name: Last Legionella Cycle
      has_date: true
      has_time: true

    dhw_boost_start_time:
      name: DHW Boost Start Time
      has_date: true
      has_time: true

  # ---------------------------
  # Phase 7 — BOOST HELPERS
  # ---------------------------

  timer:
    dhw_boost:
      name: DHW Boost (override)

  input_button:
    dhw_boost_start:
      name: Start DHW Boost
      icon: mdi:fire

    dhw_boost_cancel:
      name: Cancel DHW Boost
      icon: mdi:stop

    dhw_legionella_run_now:
      name: Legionella — Run Now
      icon: mdi:biohazard

    dhw_legionella_cancel:
      name: Legionella — Cancel
      icon: mdi:stop

  ###########################################################################
  # Templates (Phase 1 + Phase 2) — English names → English entity_id slugs
  ###########################################################################

  template:
    - sensor:
        # Active price threshold (c/kWh) computed from daily average x factor,
        # capped by the manual price cap when mode = "Dynamic + cap".
        - name: "DHW active threshold (c/kWh)" # -> entity_id: sensor.dhw_active_threshold_ckwh
          unique_id: dhw_active_threshold_ckwh
          unit_of_measurement: "c/kWh"
          device_class: monetary
          state: |
            {% set avg_today = states('sensor.nordpool_average_today') | float(0) %}
            {% set factor = states('input_number.dynamic_threshold_factor') | float(0.85) %}
            {% set dyn = (avg_today * factor) if avg_today > 0 else 0 %}
            {% set cap = float(states('input_number.korkein_sallittu_sahkon_hinta')) %}
            {% set mode = states('input_select.dhw_pricing_mode') %}
            {% if mode == 'Dynamic + cap' %}
              {{ ([dyn if dyn > 0 else 999, cap] | min) | round(2) }}
            {% elif mode == 'Dynamic only' %}
              {{ (dyn if dyn > 0 else 999) | round(2) }}
            {% else %}
              {{ cap | round(2) }}
            {% endif %}
          attributes:
            dynamic_today: |
              {% set avg = states('sensor.nordpool_average_today') | float(0) %}
              {% set k = states('input_number.dynamic_threshold_factor') | float(0.85) %}
              {{ (avg * k) | round(2) if avg > 0 else 'unknown' }}
            mode: "{{ states('input_select.dhw_pricing_mode') }}"
            cap: "{{ float(states('input_number.korkein_sallittu_sahkon_hinta')) }}"

        - name: "DHW Heating Decision Code"
          unique_id: dhw_heating_decision_code
          unit_of_measurement: "code"
          state_class: measurement
          state: |
            {% set vicare_boost = is_state('binary_sensor.maalampo_one_time_charge','on') %}
            {% set manual_on = is_state('binary_sensor.dhw_manual_today_active','on') %}
            {% set morning_ok = is_state('binary_sensor.dhw_morning_reasonable','on') %}
            {% set cheapest_on = is_state('binary_sensor.dhw_cheapest_window_active_now','on') %}
            {% set active_count = [vicare_boost, manual_on, morning_ok, cheapest_on] | select('true') | list | length %}
            {% if vicare_boost %}
              5
            {% elif manual_on and active_count > 1 %}
              1
            {% elif manual_on %}
              4
            {% elif morning_ok and active_count > 1 %}
              1
            {% elif morning_ok %}
              3
            {% elif cheapest_on and active_count > 1 %}
              1
            {% elif cheapest_on %}
              2
            {% else %}
              0
            {% endif %}
          attributes:
            vicare_boost: "{{ is_state('binary_sensor.maalampo_one_time_charge','on') }}"
            manual_window: "{{ is_state('binary_sensor.dhw_manual_today_active','on') }}"
            morning_window: "{{ is_state('binary_sensor.dhw_morning_reasonable','on') }}"
            cheapest_window: "{{ is_state('binary_sensor.dhw_cheapest_window_active_now','on') }}"
            description: |
              {% set code = this.state | int(0) %}
              {% if code == 0 %}
                OFF
              {% elif code == 1 %}
                MULTIPLE ACTIVE
              {% elif code == 2 %}
                CHEAPEST WINDOW
              {% elif code == 3 %}
                MORNING WINDOW
              {% elif code == 4 %}
                MANUAL WINDOW
              {% elif code == 5 %}
                VICARE BOOST
              {% endif %}

        - name: "DHW Boost Elapsed Time"
          unique_id: dhw_boost_elapsed_time
          state: |
            {% if is_state('timer.dhw_boost','active') %}
              {% set started = states.timer.dhw_boost.last_changed %}
              {% if started %}
                {% set elapsed = (now() - started).total_seconds() | int %}
                {{ '%02d:%02d:%02d' % (elapsed // 3600, (elapsed % 3600) // 60, elapsed % 60) }}
              {% else %} unknown {% endif %}
            {% else %} idle {% endif %}

        - name: "Nordpool Average Yesterday"
          unique_id: nordpool_average_yesterday
          unit_of_measurement: "c/kWh"
          device_class: monetary
          state_class: measurement
          state: |
            {% set slots = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
            {% set today0 = as_local(today_at('00:00:00')) %}
            {% set y0 = today0 - timedelta(days=1) %}
            {% set y1 = today0 - timedelta(milliseconds=1) %}
            {% set ns = namespace(vals=[]) %}
            {% for s in slots %}
              {% set st = as_local(as_datetime(s.start)) %}
              {% if st >= y0 and st <= y1 %}
                {% set ns.vals = ns.vals + [ s.price | float(0) ] %}
              {% endif %}
            {% endfor %}
            {{ (ns.vals | sum / (ns.vals | length)) | round(2) if ns.vals | length > 0 else 'unknown' }}

        # ------------------------------
        # CHEAPEST WINDOW (DETAIL)
        # ------------------------------
        - name: "DHW cheapest window (detail)"
          unique_id: dhw_cheapest_window_detail
          availability: |
            {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
            {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
            {{ (merged | length) >= k and k > 0 }}
          state: |
            {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
            {% set k = (states('input_number.dhw_cheapest_window_hours') | float(6) * 4) | int %}
            {% set today0 = as_local(today_at('00:00:00')) %}
            {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
            {% if (merged | length) < k or k <= 0 %}
              unknown
            {% else %}
              {% set ns = namespace(c=0) %}
              {% for i in range((merged | length) - k + 1) %}
                {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                {% if sdt >= today0 and edt <= today1 %}
                  {% set ns.c = ns.c + 1 %}
                {% endif %}
              {% endfor %}
              {{ 'ready' if ns.c > 0 else 'unknown' }}
            {% endif %}

          attributes:
            # -----------------------------
            # ABSOLUTE TODAY — full day scan (00:00–23:59), pick min-sum window
            # -----------------------------
            today_absolute_start: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(6) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% set today0 = as_local(today_at('00:00:00')) %}
              {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
              {% set ns = namespace(best=9e9, best_i=-1) %}
              {% for i in range((prices | length) - k + 1) %}
                {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                {% if sdt >= today0 and edt <= today1 %}
                  {% set sumv = (prices[i:i+k] | sum) %}
                  {% if sumv < ns.best %}
                    {% set ns.best = sumv %}
                    {% set ns.best_i = i %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ merged[ns.best_i]['start'] if ns.best_i >= 0 else 'unknown' }}

            today_absolute_end: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(6) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% set today0 = as_local(today_at('00:00:00')) %}
              {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
              {% set ns = namespace(best=9e9, best_i=-1) %}
              {% for i in range((prices | length) - k + 1) %}
                {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                {% if sdt >= today0 and edt <= today1 %}
                  {% set sumv = (prices[i:i+k] | sum) %}
                  {% if sumv < ns.best %}
                    {% set ns.best = sumv %}
                    {% set ns.best_i = i %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ merged[ns.best_i + k - 1]['end'] if ns.best_i >= 0 else 'unknown' }}

            today_absolute_sum_price: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(6) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% set today0 = as_local(today_at('00:00:00')) %}
              {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
              {% set ns = namespace(best=9e9) %}
              {% for i in range((prices | length) - k + 1) %}
                {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                {% if sdt >= today0 and edt <= today1 %}
                  {% set sumv = (prices[i:i+k] | sum) %}
                  {% if sumv < ns.best %}
                    {% set ns.best = sumv %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.best | round(3) if ns.best < 9e9 else 'unknown' }}

            today_absolute_avg_price: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(6) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% set today0 = as_local(today_at('00:00:00')) %}
              {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
              {% set ns = namespace(best=9e9) %}
              {% for i in range((prices | length) - k + 1) %}
                {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                {% if sdt >= today0 and edt <= today1 %}
                  {% set sumv = (prices[i:i+k] | sum) %}
                  {% if sumv < ns.best %}
                    {% set ns.best = sumv %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ (ns.best / k) | round(3) if ns.best < 9e9 else 'unknown' }}

            start: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set now_local = now() %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9, best_i=-1) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set end_dt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if end_dt > now_local and end_dt <= today1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ merged[ns.best_i]['start'] if ns.best_i >= 0 else 'unknown' }}
              {% endif %}

            end: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set now_local = now() %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9, best_i=-1) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set end_dt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if end_dt > now_local and end_dt <= today1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ merged[ns.best_i + k - 1]['end'] if ns.best_i >= 0 else 'unknown' }}
              {% endif %}

            sum_price: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set now_local = now() %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9, best_i=-1) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set end_dt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if end_dt > now_local and end_dt <= today1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.best_sum | round(3) if ns.best_i >= 0 else 'unknown' }}
              {% endif %}

            avg_price: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set now_local = now() %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set today1 = today0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9, best_i=-1) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set end_dt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if end_dt > now_local and end_dt <= today1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ (ns.best_sum / k) | round(3) if ns.best_i >= 0 and k > 0 else 'unknown' }}
              {% endif %}

            # -----------------------------
            # TOMORROW — full day window
            # -----------------------------
            tomorrow_start: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set tom0 = today0 + timedelta(days=1) %}
                {% set tom1 = tom0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9, best_i=-1) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                  {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if sdt >= tom0 and edt <= tom1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ merged[ns.best_i]['start'] if ns.best_i >= 0 else 'unknown' }}
              {% endif %}

            tomorrow_end: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set tom0 = today0 + timedelta(days=1) %}
                {% set tom1 = tom0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9, best_i=-1) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                  {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if sdt >= tom0 and edt <= tom1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ merged[ns.best_i + k - 1]['end'] if ns.best_i >= 0 else 'unknown' }}
              {% endif %}

            tomorrow_sum_price: |
              {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set prices = merged | map(attribute='price') | map('float') | list %}
              {% if (prices | length) < k or k <= 0 %}
                unknown
              {% else %}
                {% set today0 = as_local(today_at('00:00:00')) %}
                {% set tom0 = today0 + timedelta(days=1) %}
                {% set tom1 = tom0 + timedelta(days=1) - timedelta(milliseconds=1) %}
                {% set ns = namespace(best_sum=9e9) %}
                {% for i in range((prices | length) - k + 1) %}
                  {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                  {% set edt = as_local(as_datetime(merged[i + k - 1]['end'])) %}
                  {% if sdt >= tom0 and edt <= tom1 %}
                    {% set sumv = (prices[i:i+k] | sum) %}
                    {% if sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.best_sum | round(3) if ns.best_sum < 9e9 else 'unknown' }}
              {% endif %}

            tomorrow_avg_price: |
              {% set k = (states('input_number.dhw_cheapest_window_hours') | float(2) * 4) | int %}
              {% set sumc = this.attributes.tomorrow_sum_price %}
              {% if sumc in ['unknown','unavailable',''] or k <= 0 %}
                unknown
              {% else %}
                {{ (sumc / k) | round(3) }}
              {% endif %}

