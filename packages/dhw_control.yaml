              {% if last_raw and (last_raw | lower) not in ['unknown','unavailable','none',''] %}
                {% set last_dt = as_local(as_datetime(last_raw)) %}
              {% else %}
                {% set last_dt = none %}
              {% endif %}
              {% set days = ((now() - last_dt).total_seconds() / 86400) if last_dt else 999 %}

              {% set se = state_attr('binary_sensor.dhw_legionella_cheapest_slot_strict','end') %}
              {% set ae = state_attr('binary_sensor.dhw_legionella_cheapest_slot_any','end') %}
              {% set ss = state_attr('binary_sensor.dhw_legionella_cheapest_slot_strict','start') %}
              {% set as_ = state_attr('binary_sensor.dhw_legionella_cheapest_slot_any','start') %}

              {% set strict_start = as_local(as_datetime(ss)) if ss and (ss | lower) not in ['unknown','unavailable','none',''] else none %}
              {% set any_start    = as_local(as_datetime(as_)) if as_ and (as_ | lower) not in ['unknown','unavailable','none',''] else none %}
              {% set strict_end   = as_local(as_datetime(se)) if se and (se | lower) not in ['unknown','unavailable','none',''] else none %}
              {% set any_end      = as_local(as_datetime(ae)) if ae and (ae | lower) not in ['unknown','unavailable','none',''] else none %}

              {% set strict_future = strict_start is not none and strict_start > now() %}
              {% set any_future    = any_start is not none and any_start > now() %}

              {% if strict_future and days >= 3 %}
                {{ strict_end }}
              {% elif any_future and days >= 7 %}
                {{ any_end }}
              {% else %}
                unknown
              {% endif %}
            {% endif %}
          attributes:
            days_since_last: >
              {% set last_raw = states('input_datetime.dhw_legionella_last_run') %}
              {% if last_raw and (last_raw | lower) not in ['unknown','unavailable','none',''] %}
