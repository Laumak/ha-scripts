            any_end_raw: "{{ state_attr('binary_sensor.dhw_legionella_cheapest_slot_any','end') }}"

        - name: "DHW Legionella Next Run Avg Price"
          unique_id: dhw_legionella_next_run_avg_price
          state: >
            {% set price_entity = 'sensor.nordpool_3_day_merged_prices' %}
            {% set ns = states('sensor.dhw_legionella_next_start') %}
            {% set ne = states('sensor.dhw_legionella_next_end') %}
            {% if ns in ['unknown','unavailable','','none'] or ne in ['unknown','unavailable','','none'] %}
              unknown
            {% else %}
              {% set ns_dt = as_local(as_datetime(ns)) %}
              {% set ne_dt = as_local(as_datetime(ne)) %}
              {% set slots = state_attr(price_entity,'merged_slots') %}
              {% if not slots %}
                unknown
              {% else %}
                {% set nsn = namespace(total=0.0, cnt=0) %}
                {% for it in slots %}
                  {% set s = it.start if it.start is defined else (it['start'] if 'start' in it else none) %}
                  {% set e = it.end   if it.end   is defined else (it['end']   if 'end'   in it else none) %}
                  {% set p = it.price if it.price is defined else (it['price'] if 'price' in it else none) %}
                  {% if s not in [none,'','unknown','unavailable'] and e not in [none,'','unknown','unavailable'] and p not in [none,'','unknown','unavailable'] %}
                    {% set sdt = as_local(as_datetime(s)) %}
                    {% set edt = as_local(as_datetime(e)) %}
                    {% if sdt < ne_dt and edt > ns_dt %}
                      {% set nsn.total = nsn.total + (p | float) %}
                      {% set nsn.cnt = nsn.cnt + 1 %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% if nsn.cnt == 0 %} unknown {% else %} {{ (nsn.total / nsn.cnt) | round(3) }} {% endif %}
              {% endif %}
            {% endif %}
          unit_of_measurement: "c/kWh"

    - binary_sensor:
        - name: "DHW manual today active"
          unique_id: dhw_manual_today_active
          state: |
            {% if is_state('input_boolean.dhw_manual_today_enable','off') %}
              false
            {% else %}
              {% set ns = namespace(active=false) %}
              {% for slot in [1,2] %}
                {% set s = states('input_datetime.dhw_manual_today_start_slot' ~ slot) %}
                {% set e = states('input_datetime.dhw_manual_today_end_slot' ~ slot) %}
                {% if s not in ['unknown','unavailable',''] and e not in ['unknown','unavailable',''] %}
                  {% set start_dt = as_local(today_at(s)) %}
                  {% set end_dt = as_local(today_at(e)) %}
                  {% if now() >= start_dt and now() < end_dt %}
                    {% set ns.active = true %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ ns.active }}
            {% endif %}

        # ------------------------------
        # CHEAPEST WINDOW ACTIVE NOW
        # ------------------------------
        - name: "DHW cheapest window active now"
          unique_id: dhw_cheapest_window_active_now
          availability: |
            {% set s = state_attr('sensor.dhw_cheapest_window_detail','today_absolute_start') %}
            {% set e = state_attr('sensor.dhw_cheapest_window_detail','today_absolute_end') %}
            {{ s is string and e is string and s not in ['unknown','unavailable',''] and e not in ['unknown','unavailable',''] }}
