            {% else %}
              {% set last_raw = states('input_datetime.dhw_legionella_last_run') %}
              {% if last_raw and (last_raw | lower) not in ['unknown','unavailable','none',''] %}
                {% set last_dt = as_local(as_datetime(last_raw)) %}
              {% else %}
                {% set last_dt = none %}
              {% endif %}
              {% set days = ((now() - last_dt).total_seconds() / 86400) if last_dt else 999 %}

              {% set ss = state_attr('binary_sensor.dhw_legionella_cheapest_slot_strict','start') %}
              {% set as_ = state_attr('binary_sensor.dhw_legionella_cheapest_slot_any','start') %}

              {% set strict_start = as_local(as_datetime(ss)) if ss and (ss | lower) not in ['unknown','unavailable','none',''] else none %}
              {% set any_start    = as_local(as_datetime(as_)) if as_ and (as_ | lower) not in ['unknown','unavailable','none',''] else none %}

              {% if strict_start and strict_start > now() and days >= 3 %}
                {{ strict_start }}
              {% elif any_start and any_start > now() and days >= 7 %}
                {{ any_start }}
              {% else %}
                unknown
              {% endif %}
            {% endif %}
          attributes:
            days_since_last: >
              {% set last_raw = states('input_datetime.dhw_legionella_last_run') %}
              {% if last_raw and (last_raw | lower) not in ['unknown','unavailable','none',''] %}
                {% set last_dt = as_local(as_datetime(last_raw)) %}
                {{ ((now() - last_dt).total_seconds() / 86400) | round(3) }}
              {% else %}
                unknown
              {% endif %}
            strict_start_raw: "{{ state_attr('binary_sensor.dhw_legionella_cheapest_slot_strict','start') }}"
            any_start_raw: "{{ state_attr('binary_sensor.dhw_legionella_cheapest_slot_any','start') }}"

