            {% set e = state_attr('sensor.dhw_cheapest_window_detail','today_absolute_end') %}
            {% if s in ['unknown','unavailable',''] or e in ['unknown','unavailable',''] or s is not string or e is not string %}
              false
            {% else %}
              {% set start_dt = as_local(as_datetime(s)) %}
              {% set end_dt = as_local(as_datetime(e)) %}
              {{ now() >= start_dt and now() < end_dt }}
            {% endif %}
          attributes:
            window_start: "{{ state_attr('sensor.dhw_cheapest_window_detail','today_absolute_start') }}"
            window_end: "{{ state_attr('sensor.dhw_cheapest_window_detail','today_absolute_end') }}"
            length_minutes: "{{ state_attr('sensor.dhw_cheapest_window_detail','length_minutes') }}"
            source: "absolute_today (full-day min)"

        # Morning window 05-07 with reasonable price (<= active threshold)
        - name: "DHW morning reasonable" # -> binary_sensor.dhw_morning_reasonable
          unique_id: dhw_morning_reasonable
          state: |
            {% set price_now = states('sensor.current_electricity_price_in_cents') | float(999) %}
            {% set thr = states('sensor.dhw_active_threshold_ckwh') | float(0) %}
            {% set hard_cap = 10.0 %}
            {% set start = as_local(today_at(states('input_datetime.dhw_morning_start'))) %}
            {% set end = as_local(today_at(states('input_datetime.dhw_morning_end'))) %}
            {% set enabled = is_state('input_boolean.dhw_morning_enable','on') %}
            {{ enabled and now() >= start and now() < end and price_now <= thr and price_now <= hard_cap }}
          attributes:
            reason: |
              {% set price_now = states('sensor.current_electricity_price_in_cents') | float(999) %}
              {% set thr = states('sensor.dhw_active_threshold_ckwh') | float(0) %}
              {% set hard_cap = 10.0 %}
              {% set start = today_at(states('input_datetime.dhw_morning_start')) %}
              {% set end = today_at(states('input_datetime.dhw_morning_end')) %}
              {% set enabled = is_state('input_boolean.dhw_morning_enable','on') %}
              {% set within = (now() >= start and now() < end) %}
              {% set ok_thr = (price_now <= thr) %}
              {% set ok_cap = (price_now <= hard_cap) %}
              {{
                {
                  "enabled": enabled,
                  "now": now() | string,
                  "start": start | string,
                  "end": end | string,
                  "within_window": within,
                  "price_now_ckwh": price_now,
                  "threshold_ckwh": thr,
                  "hard_cap_ckwh": hard_cap,
                  "passes_threshold": ok_thr,
                  "passes_hard_cap": ok_cap,
                  "final_state_would_be_on": (enabled and within and ok_thr and ok_cap)
                } | tojson
              }}

        - name: "DHW should heat now" # -> binary_sensor.dhw_should_heat_now
          unique_id: dhw_should_heat_now
          state: |
            {% set mode = states('input_select.dhw_heating_mode') %}
            {% set manual_on = is_state('binary_sensor.dhw_manual_today_active','on') %}
            {% set morning_ok = is_state('binary_sensor.dhw_morning_reasonable','on') %}
            {% set cheapest_on = is_state('binary_sensor.dhw_cheapest_window_active_now','on') %}
            {% set vicare_boost = is_state('binary_sensor.maalampo_one_time_charge','on') %}
            {% set price_now = states('sensor.current_electricity_price_in_cents') | float(999) %}
            {% set thr = states('sensor.dhw_active_threshold_ckwh') | float(0) %}
            {% set soft_cap = float(states('input_number.dhw_cheapest_soft_cap')) %}

            {# Cheapest allowed if price <= threshold OR <= soft cap #}
            {% set cheapest_ok = cheapest_on and (price_now <= thr or price_now <= soft_cap) %}

            {% if mode == 'Automatic + Manual' %}
              {{ vicare_boost or manual_on or morning_ok or cheapest_ok }}
            {% elif mode == 'Manual only' %}
              {{ vicare_boost or manual_on }}
            {% else %}
              {{ vicare_boost }}
            {% endif %}
          attributes:
            reason: |
              {% set mode = states('input_select.dhw_heating_mode') %}
              {% set manual_on = is_state('binary_sensor.dhw_manual_today_active','on') %}
              {% set morning_ok = is_state('binary_sensor.dhw_morning_reasonable','on') %}
              {% set cheapest_on = is_state('binary_sensor.dhw_cheapest_window_active_now','on') %}
              {% set vicare_boost = is_state('binary_sensor.maalampo_one_time_charge','on') %}
              {% set price_now = states('sensor.current_electricity_price_in_cents') | float(999) %}
              {% set thr = states('sensor.dhw_active_threshold_ckwh') | float(0) %}
              {% set soft_cap = states('input_number.dhw_cheapest_soft_cap') | float(20) %}
              {% set tags = [] %}
              {% if vicare_boost %}{% set tags = tags + ['VICARE BOOST'] %}{% endif %}
              {% if manual_on %}{% set tags = tags + ['MANUAL'] %}{% endif %}
              {% if mode == 'Automatic + Manual' %}
                {% if morning_ok %}{% set tags = tags + ['MORNING'] %}{% endif %}
                {% if cheapest_on and price_now <= thr %}
                  {% set tags = tags + ['CHEAPEST (≤ threshold)'] %}
                {% elif cheapest_on and price_now <= soft_cap %}
                  {% set tags = tags + ['CHEAPEST (≤ soft cap)'] %}
                {% endif %}
              {% endif %}
              {{ tags | join(' + ') if tags else ('OFF (mode: ' ~ mode ~ ')') }}
            price_now_ckwh: "{{ states('sensor.current_electricity_price_in_cents') | float(999) }}"
            threshold_ckwh: "{{ states('sensor.dhw_active_threshold_ckwh') | float(0) }}"
            soft_cap_ckwh: "{{ states('input_number.dhw_cheapest_soft_cap') | float(20) }}"

        - name: "DHW legionella cheapest slot STRICT"
          unique_id: dhw_legionella_cheapest_slot_strict
          state: >
            {% set merged = state_attr('sensor.nordpool_3_day_merged_prices','merged_slots') or [] %}
            {% set k = (states('input_number.dhw_legionella_hours') | float(3) * 4) | int %}
            {% if k <= 0 or (merged | length) < k %}
              false
            {% else %}
              {% set now_local = now() %}
              {% set ns = namespace(best_i=-1, best_sum=9e9) %}
              {% for i in range(0, (merged|length) - k + 1) %}
                {% set sdt = as_local(as_datetime(merged[i]['start'])) %}
                {% if sdt >= now_local %}
                  {% set window = merged[i:i+k] %}
                  {% set prices = window | map(attribute='price') | map('float') | list %}
                  {% if prices|length == k %}
                    {% set sumv = prices | sum %}
                    {% set avg = sumv / k %}
                    {% if avg <= 1.0 and sumv < ns.best_sum %}
                      {% set ns.best_sum = sumv %}
                      {% set ns.best_i = i %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endfor %}
              {{ 'true' if ns.best_i >= 0 else 'false' }}
            {% endif %}
