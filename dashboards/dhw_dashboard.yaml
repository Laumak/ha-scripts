              {% if s2 != '00:00:00' %}

              Slot 2: {{ s2[:5] }} - {{
              states('input_datetime.dhw_manual_today_end_slot2')[:5] }}

              {% endif %}

              {% endif %}

              {% set ts1 =
              states('input_datetime.dhw_manual_tomorrow_start_slot1') %} {% set
              te1 = states('input_datetime.dhw_manual_tomorrow_end_slot1') %} {%
              set ts2 = states('input_datetime.dhw_manual_tomorrow_start_slot2')
              %} {% set te2 =
              states('input_datetime.dhw_manual_tomorrow_end_slot2') %} {% set
              has_t1 = ts1 not in ['unknown','unavailable','','00:00:00'] and
              te1 not in ['unknown','unavailable','','00:00:00'] %} {% set
              has_t2 = ts2 not in ['unknown','unavailable','','00:00:00'] and
              te2 not in ['unknown','unavailable','','00:00:00'] %}

              {% if has_t1 or has_t2 %} **Manuaali huomenna:**
                  {% if has_t1 %}- Slot 1: {{ ts1[:5] }} - {{ te1[:5] }}{% endif %}
                  {% if has_t2 %}- Slot 2: {{ ts2[:5] }} - {{ te2[:5] }}{% endif %}
              {% endif %}

              **Aamulla:**

              {{ states('input_datetime.dhw_morning_start')[:5] }} - {{
                states('input_datetime.dhw_morning_end')[:5] }} *({{ 'päällä' if
                is_state('input_boolean.dhw_morning_enable','on') else 'EI päällä' }})*
