                  {{ as_local(as_datetime(iso)).strftime('%d.%m %H:%M') }}
                {%- else -%}unknown{%- endif -%}
              {% endmacro %}

              {% macro fmt_time(iso) %}
                {%- if iso and iso not in ['unknown','unavailable','none',''] -%}
                  {{ as_local(as_datetime(iso)).strftime('%H:%M') }}
                {%- else -%}?{%- endif -%}
              {% endmacro %}

              {% set abs_e =
              state_attr('sensor.dhw_absolute_cheapest_window_label','end') %}
              {% if abs_e and abs_e not in ['unknown','unavailable','none','']
