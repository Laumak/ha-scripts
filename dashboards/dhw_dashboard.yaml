                    color: darkred
                    opacity: 1
                data_generator: |
                  const data = entity.attributes.forecast || [];
                  return data.map((item) => [item.timestamp, item.value]);
                show:
                  in_chart: true
                  in_header: false
                  in_legend: true
                  legend_value: false
              - entity: sensor.nordpool_predict_fi_price
                type: area
                yaxis_id: price
                extend_to: now
                curve: stepline
                stroke_width: 0
                float_precision: 1
                color: limegreen
                opacity: 0.16
                data_generator: |
                  const data = entity.attributes.forecast || [];
                  return data.map((item) => [item.timestamp, item.value]);
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                  legend_value: false
              - entity: sensor.nordpool_predict_fi_price
                name: Ennuste
                type: line
                yaxis_id: price
                curve: straight
                stroke_width: 1
                stroke_dash: 3
                color: red
                opacity: 1
                extend_to: false
                data_generator: >
                  const fs =
                  hass.states['sensor.nordpool_predict_fi_price']?.attributes?.forecast_start;

                  const x = fs ? Date.parse(fs) : NaN;

                  if (!Number.isFinite(x)) return [];

                  const data = entity.attributes.forecast || [];

                  let min = Infinity, max = -Infinity;

                  for (const i of data) {
                    const v = Number(i.value);
                    if (Number.isFinite(v)) { if (v < min) min = v; if (v > max) max = v; }
                  }

                  if (!Number.isFinite(min) || !Number.isFinite(max)) { min = 0;
                  max = 1; }

                  // Add a null point at x+1 ms to stop the path from continuing
                  horizontally.

                  return [[x, min], [x, max], [x + 1, null]];
                show:
                  in_chart: true
                  in_header: false
                  in_legend: false
                  legend_value: false
