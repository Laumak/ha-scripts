              {% set s = state_attr('sensor.dhw_cheapest_window_label','start')
              %} {% set e = state_attr('sensor.dhw_cheapest_window_label','end')
              %} {% set avg =
              state_attr('sensor.dhw_cheapest_window_label','avg_price') %} {{
              fmt(s) }} → {{ fmt_time(e) }} *({{ avg }} c/kWh)*


              **Halvin ikkuna huomenna:**

              {% set s =
              state_attr('sensor.dhw_cheapest_window_label_tomorrow','start') %}
              {% set e =
              state_attr('sensor.dhw_cheapest_window_label_tomorrow','end') %}
              {% set avg =
