              (abs):** {% set s =
              state_attr('sensor.dhw_absolute_cheapest_window_label','start') %}
              {% set avg =
              state_attr('sensor.dhw_absolute_cheapest_window_label','avg_price')
              %}

              {{ fmt(s) }} → {{ fmt_time(abs_e) }} *({{ avg }} c/kWh)* {% endif
              %}

